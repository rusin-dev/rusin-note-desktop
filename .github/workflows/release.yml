name: Build & Release

on:
  push:
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空取 pyproject.toml）"
        required: false
        default: ""
      channel:
        description: "更新渠道"
        required: true
        default: "stable"
        type: choice
        options: [ stable, beta ]
      notes:
        description: "更新说明（展示在网页版 /downloads 落地页）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 编译 pycairo / pygobject 需要系统头文件与 pkg-config
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev gir1.2-webkit2-4.1 libgtk-3-dev \
            libcairo2-dev pkg-config gcc python3-dev

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: 运行测试
        run: uv run pytest tests/ -q -m "not network"

  build:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux 的 pywebview 走 GTK/WebKit2，PyGObject 需要系统头文件与 GIR
      - name: 安装 Linux 系统依赖
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev gir1.2-webkit2-4.1 libgtk-3-dev \
            libcairo2-dev pkg-config gcc python3-dev

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: 运行测试
        run: uv run pytest tests/ -q -m "not network"

      - name: 解析版本与渠道
        id: meta
        shell: bash
        run: |
          version="${{ inputs.version }}"
          channel="${{ inputs.channel }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # 带预发布后缀（如 0.2.0-beta.1）的标签归入 beta 渠道
            if [[ "$version" == *-* ]]; then channel="beta"; else channel="stable"; fi
          fi
          if [[ -z "$channel" ]]; then channel="stable"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: 构建并生成下载产物
        shell: bash
        run: |
          args=(--channel "${{ steps.meta.outputs.channel }}" --notes "${{ inputs.notes }}")
          if [[ -n "${{ steps.meta.outputs.version }}" ]]; then
            args+=(--version "${{ steps.meta.outputs.version }}")
          fi
          uv run python release/build.py "${args[@]}"

      - name: 上传本平台产物
        uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ matrix.platform }}
          path: dist/downloads/
          if-no-files-found: error
          retention-days: 7

  # 合并三平台清单，并把安装包与 manifest.json 挂到 Release：
  # 网页版 /downloads 读 releases/latest/download/manifest.json，下载 302 到同一 Release
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev gir1.2-webkit2-4.1 libgtk-3-dev \
            libcairo2-dev pkg-config gcc python3-dev

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: 下载各平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: downloads-*
          path: dist/downloads/
          merge-multiple: true

      - name: 合并清单
        run: |
          uv run python release/build.py --merge dist/downloads
          find dist/downloads -name 'manifest-*.json' -delete

      - name: 发布 Release（标签触发）
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # 带 - 的标签（如 v0.2.0-beta.1）标记为预发布，不会成为 releases/latest
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/downloads/*

      - name: 保留构建产物（手动触发时下载用）
        uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: dist/downloads/
          if-no-files-found: error
          retention-days: 30
